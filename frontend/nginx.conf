server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= VECTORSNAP_MAX_UPLOAD_MB
    client_max_body_size 12m;

    # Text files go compressed (the main script: 770 KB as built, 250 KB sent).
    # The image keeps a .gz copy of each (gzip_static); anything else is compressed
    # on the fly. Proxied API answers are left to the backend, which compresses them.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # The page and its files: only the app's own scripts, styles and API calls; images
    # also from data: and blob: URLs (previews, fragments). With VITE_API_BASE_URL on
    # another origin, add that origin to connect-src.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Locations that add a header of their own (Cache-Control below) keep these too:
    # by default nginx drops them there, which left the page and its scripts without.
    add_header_inherit merge;

    location /api/ {
        # The backend sends its own (app/core/security.py).
        add_header_inherit off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
