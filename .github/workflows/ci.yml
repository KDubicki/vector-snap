# CI orchestrator. Detects which parts of the monorepo changed and runs only the
# relevant pipelines. `CI result` is the single required status check.
# See docs/12-ci-cd.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      tooling: ${{ steps.scope.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
      - name: Resolve pipeline scope
        id: scope
        env:
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          TOOLING: ${{ steps.filter.outputs.tooling }}
        run: |
          if [[ "$RUN_ALL" == "true" ]]; then
            BACKEND=true
            FRONTEND=true
            TOOLING=true
          fi
          {
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "tooling=$TOOLING"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Pipeline scope"
            echo "| Pipeline | Runs |"
            echo "|---|---|"
            echo "| Shared files changed (forces all) | $RUN_ALL |"
            echo "| Backend | $BACKEND |"
            echo "| Frontend | $FRONTEND |"
            echo "| Repository tooling | $TOOLING |"
          } >> "$GITHUB_STEP_SUMMARY"

  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Commitlint
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            scripts/lint-commits.sh --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            scripts/lint-commits.sh --from "$PUSH_BEFORE" --to "$PUSH_AFTER" --verbose
          else
            # New branch / manual run: no reliable range, check the latest commit.
            scripts/lint-commits.sh --last --verbose
          fi

  tooling:
    name: Repository tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actionlint (workflows, includes shellcheck of run blocks)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Shellcheck (scripts and git hooks)
        run: shellcheck scripts/*.sh scripts/ci/*.sh .githooks/*

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml

  stack:
    name: Stack smoke test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare environment
        run: cp .env.example .env
      - name: Start stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Check frontend and API through nginx
        run: |
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          curl --fail --silent --show-error http://localhost:8080/api/v1/health
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  result:
    name: CI result
    if: always()
    needs: [changes, commits, tooling, backend, frontend, stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
